[project]
name = "foresight"
version = "0.1.0"
description = "Data-first, AI-native operations platform for DTC / e-com brands."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - All Rights Reserved" }
authors = [{ name = "Logan Kudlacik" }]
# Runtime dependencies are intentionally empty for now. FastAPI / SQLAlchemy /
# Alembic / pandas / etc. land with their respective epics (E2-E5). If image
# bloat becomes a concern, we can split into optional-dependencies extras
# (`foresight[api]`, `foresight[worker]`) without restructuring the package.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foresight"]

# PEP 735 dependency groups. Resolved by `uv sync --group <name>`.
[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
]
lint = [
    "ruff>=0.6",
    "black>=24",
    "mypy>=1.10",
]
dev = [
    "ipython",
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv]
# Always install the dev group by default so a bare `uv sync` produces a
# working development environment. Override with `--no-default-groups` for
# minimal envs (e.g., production containers).
default-groups = ["dev"]

# ----- Tool configuration -----

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["foresight", "tests"]

[tool.ruff.lint]
# Conservative starter set; expanded in E1.S4 alongside pre-commit.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
# Scope mypy to the production package; tests are excluded for now to keep
# strict-mode noise down (re-enabled when tests grow beyond smoke checks).
files = ["foresight"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
# `importlib` mode is the modern recommendation for monorepos and keeps the
# door open for multiple `test_*.py` files across subpackage trees without
# basename collisions.
addopts = "-ra --import-mode=importlib --cov --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["foresight"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
