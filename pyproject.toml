[project]
name = "foresight"
version = "0.1.0"
description = "Data-first, AI-native operations platform for DTC / e-com brands."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - All Rights Reserved" }
authors = [{ name = "Logan Kudlacik" }]
# Runtime dependencies land with each story that needs them. If image bloat
# ever becomes a concern, split into optional-dependencies extras
# (`foresight[api]`, `foresight[worker]`) without restructuring the package.
dependencies = [
    # E2.S1 — data model + storage primitives
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uuid-utils>=0.10",  # UUIDv7 generation (PEP 442 / RFC 9562)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foresight"]

# PEP 735 dependency groups. Resolved by `uv sync --group <name>`.
[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    # `tests/test_ci.py` parses .github/workflows/ci.yml. PyYAML is a
    # transitive dep of pre-commit too, but declaring it explicitly here
    # documents the test's actual dependency.
    "pyyaml>=6",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=4",
    "import-linter>=2.1",
]
dev = [
    "ipython",
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv]
# Always install the dev group by default so a bare `uv sync` produces a
# working development environment. Override with `--no-default-groups` for
# minimal envs (e.g., production containers).
default-groups = ["dev"]

# ----- Tool configuration -----

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["foresight", "tests"]

[tool.ruff.lint]
# Conservative starter set; expanded in E1.S4 alongside pre-commit.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
# Scope mypy to the production package; tests are excluded for now to keep
# strict-mode noise down (re-enabled when tests grow beyond smoke checks).
files = ["foresight"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
# `importlib` mode is the modern recommendation for monorepos and keeps the
# door open for multiple `test_*.py` files across subpackage trees without
# basename collisions.
addopts = "-ra --import-mode=importlib --cov --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["foresight"]
omit = [
    "*/__pycache__/*",
    # `db.py` and `settings.py` are minimal scaffolding for E2.S1; E2.S3
    # provides the full storage abstraction and exercises both modules.
    # Including them now would force premature tests for code that's
    # about to be rewritten.
    "foresight/core/db.py",
    "foresight/core/settings.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

# ----- import-linter (layering rules) -----
# Machine-enforces the subpackage layering rules documented in
# `foresight/__init__.py`. Run via `uv run lint-imports`, in pre-commit,
# and in CI.
[tool.importlinter]
root_packages = ["foresight"]

[[tool.importlinter.contracts]]
name = "foresight.core is the foundation"
type = "forbidden"
source_modules = ["foresight.core"]
forbidden_modules = ["foresight.api", "foresight.worker", "foresight.agents"]

[[tool.importlinter.contracts]]
name = "foresight.api may not import foresight.worker"
type = "forbidden"
source_modules = ["foresight.api"]
forbidden_modules = ["foresight.worker"]

[[tool.importlinter.contracts]]
name = "foresight.worker may not import foresight.api"
type = "forbidden"
source_modules = ["foresight.worker"]
forbidden_modules = ["foresight.api"]

[[tool.importlinter.contracts]]
name = "foresight.agents may only import foresight.core"
type = "forbidden"
source_modules = ["foresight.agents"]
forbidden_modules = ["foresight.api", "foresight.worker"]
